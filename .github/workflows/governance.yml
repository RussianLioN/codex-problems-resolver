name: governance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 scripts/validate_repository.py
      - run: python3 scripts/repository_policy.py validate
      - run: python3 -m unittest discover -s tests -p 'test_*.py'

  drift:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Select drift check mode
        shell: bash
        env:
          POLICY_AUDIT_TOKEN: ${{ secrets.POLICY_AUDIT_TOKEN }}
        run: |
          if [ -n "$POLICY_AUDIT_TOKEN" ]; then
            echo "DRIFT_MODE=full" >> "$GITHUB_ENV"
          else
            echo "DRIFT_MODE=builtin" >> "$GITHUB_ENV"
            echo "::notice::POLICY_AUDIT_TOKEN is not configured; running builtin drift check"
            echo "POLICY_AUDIT_TOKEN is not configured; running builtin drift check." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Full drift check
        if: env.DRIFT_MODE == 'full'
        run: python3 scripts/repository_policy.py check --repo RussianLioN/codex-problems-resolver --mode full
        env:
          GH_TOKEN: ${{ secrets.POLICY_AUDIT_TOKEN }}
      - name: Builtin drift check
        if: env.DRIFT_MODE == 'builtin'
        run: python3 scripts/repository_policy.py check --repo RussianLioN/codex-problems-resolver --mode builtin
        env:
          GH_TOKEN: ${{ github.token }}
